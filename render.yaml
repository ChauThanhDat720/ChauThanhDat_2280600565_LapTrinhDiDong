services:
  - type: web
    name: smart-hospital-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DEMO_MODE
        value: "1"
      - key: NODE_ENV
        value: production
